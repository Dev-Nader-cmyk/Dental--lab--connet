name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -q "$ZIP" -d project
          echo "Extracted:"
          find project -maxdepth 4 -type f -name "gradlew" -print

      - name: Find Android project
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE/project" -type f -name "gradlew" | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          find "$GITHUB_WORKSPACE/project" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dental-Lab-Connect-APK
          path: project/**/*.apk
